name: .NET Build, Test & Publish

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore BiMap.sln

    - name: Build
      run: dotnet build --no-restore BiMap.sln --configuration Release

    - name: Test
      run: dotnet test --no-build BiMap.sln --configuration Release

    - name: Pack
      run: dotnet pack BiMap/BiMap.csproj --no-build --configuration Release --output nuget-packages

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: nuget-packages/*.nupkg
        if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # let this job mint the OIDC token Trusted Publishing exchanges
      packages: write   # push to GitHub Packages
      contents: read

    steps:
    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: nuget-packages

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Kept immediately before the push on purpose: the key nuget.org hands back
    # is valid for one hour, and each OIDC token buys exactly one key.
    - name: NuGet login (OIDC to short-lived key)
      uses: NuGet/login@v1
      id: login
      with:
        user: TahaZahit

    - name: Publish to NuGet
      run: dotnet nuget push "nuget-packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish to GitHub Packages
      run: dotnet nuget push "nuget-packages/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
